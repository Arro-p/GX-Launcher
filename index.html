<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tauri Launcher</title>
  <meta name="description" content="Tauri Launcher is a free browser-based Eaglercraft launcher.">
  <style>
    :root {
      --bg-color: #0b1c0b;
      --panel-bg: #132a13;
      --accent: #2ecc71;
      --accent-hover: #27ae60;
      --text: #e0f2e0;
      --text-dim: #9ab99a;
      --border: #1e3f1e;
    }
    
    * {
      box-sizing: border-box;
      border-radius: 0 !important; /* Blocky edges */
    }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .launcher {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 4px solid var(--border);
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--border);
      padding: 5px 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--accent);
    }

    .title-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
    }

    .title-controls {
      display: flex;
      gap: 5px;
    }

    .wdot {
      width: 12px;
      height: 12px;
      background: var(--text-dim);
      cursor: pointer;
    }
    .wdot:hover { background: var(--text); }
    .wdot.close:hover { background: #e74c3c; }

    .content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: var(--panel-bg);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .profile {
      padding: 0 20px 20px;
      border-bottom: 2px solid var(--border);
    }

    .profile-label { font-size: 0.8em; color: var(--text-dim); text-transform: uppercase; }
    .profile-name { font-size: 1.5em; font-weight: bold; display: block; margin-top: 5px;}
    .profile-status { display: flex; align-items: center; gap: 5px; color: var(--accent); font-size: 0.9em; margin-top: 5px; }
    .status-dot { width: 8px; height: 8px; background: var(--accent); }

    nav { flex: 1; padding: 20px 0; }

    .nav-section-label {
      padding: 0 20px 10px;
      font-size: 0.8em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .nav-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      color: var(--text-dim);
      border-left: 4px solid transparent;
      transition: 0.2s;
    }

    .nav-item:hover, .nav-item.selected {
      background: rgba(46, 204, 113, 0.1);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

    .sidebar-bottom { border-top: 2px solid var(--border); padding-top: 10px; }

    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #0f220f;
    }

    .top-bar {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      background: var(--panel-bg);
    }

    .game-title { font-size: 1.5em; font-weight: bold; }
    .game-title span { color: var(--accent); }
    .breadcrumb { color: var(--text-dim); font-size: 0.9em; align-self: flex-end;}

    .main-content {
      flex: 1;
      position: relative;
      background: repeating-linear-gradient(45deg, #0b1c0b, #0b1c0b 10px, #0f220f 10px, #0f220f 20px);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-color), transparent);
    }

    .launch-bar {
      padding: 20px;
      background: var(--panel-bg);
      border-top: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .version-wrapper { position: relative; flex: 1; max-width: 400px; }

    .version-select {
      background: var(--bg-color);
      border: 2px solid var(--border);
      padding: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .version-select:hover { border-color: var(--accent); }

    .launch-mode-badge {
      padding: 10px 20px;
      background: var(--bg-color);
      border: 2px solid var(--border);
      color: var(--text-dim);
      font-weight: bold;
      cursor: pointer;
    }

    .play-button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 15px 50px;
      font-size: 1.5em;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: 0.2s;
    }

    .play-button:hover { background: var(--accent-hover); }

    .bottom-bar {
      background: var(--border);
      padding: 5px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.8em;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
<div class="launcher">
  <div class="title-bar">
    <div class="title-logo">
      <div class="title-dot"></div>
      TAURI LAUNCHER <span class="ver">v2.5.1</span>
    </div>
    <div class="title-controls">
      <div class="wdot min"></div>
      <div class="wdot max"></div>
      <div class="wdot close"></div>
    </div>
  </div>

  <div class="content">
    <div class="sidebar">
      <div class="profile">
        <div class="profile-label">Player</div>
        <span class="profile-name" id="profile-name">Player</span>
        <div class="profile-status"><div class="status-dot"></div>ONLINE</div>
      </div>
      <nav>
        <div class="nav-section-label">Navigation</div>
        <div class="nav-item selected">
          <svg class="nav-svg" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="1"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
          Game
        </div>
        <div class="nav-item">
          <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
          Clients
        </div>
        <div class="nav-item">
          <svg class="nav-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><rect x="2" y="10" width="20" height="5" rx="1"/><rect x="2" y="17" width="20" height="5" rx="1"/></svg>
          Servers
        </div>
      </nav>
      <div class="sidebar-bottom">
        <div class="nav-item">
          <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Launcher Settings
        </div>
      </div>
    </div>
    <div class="main-panel">
      <div class="top-bar">
        <div class="game-title">TAURI LAUNCHER <span>// GAME</span></div>
        <div class="breadcrumb">HOME / GAME</div>
      </div>
      <div class="main-content">
        <div class="hero-overlay"></div>
      </div>
      <div class="launch-bar">
        <div class="version-wrapper">
          <div class="version-select">
            <span>Select Version: 1.8.8</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="launch-mode-badge">
          MODE: REGULAR
        </div>
        <button class="play-button">LAUNCH</button>
      </div>
      <div class="bottom-bar">
        <div class="status-line">READY</div>
        <div class="credit">Built by Launcher Team</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
